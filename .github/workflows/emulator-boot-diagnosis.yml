name: Emulator boot diagnosis
on:
  push:
    branches:
      - test/emulator-demo-66063-isolated
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check and enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Start Android emulator and verify adb
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: adb wait-for-device && adb shell getprop sys.boot_completed && echo ::notice::EMULATOR_BOOT_OK
