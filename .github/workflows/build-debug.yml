name: Build verified sanitized debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [.ci-diagnostics/**, public-downloads/**, source-parts/**]
permissions:
  contents: write
jobs:
  build-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "17"}
      - name: Restore all source chunks with integrity checks
        run: node tools/restore-sources.cjs
      - name: Deep scan restored public sources
        run: node tools/deep-scan.cjs
      - name: Install verified Gradle
        run: |
          curl --fail --location --retry 3 --output /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          echo "d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab  /tmp/gradle.zip" | sha256sum --check --strict
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify ZIP and deep scan decompressed APK
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          unzip -l "$apk" | grep -q AndroidManifest.xml
          node tools/deep-scan.cjs --apk "$apk"
          sha256sum "$apk"
      - name: Publish only the verified new APK
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          mkdir -p public-downloads
          cp "$apk" public-downloads/aspas-beta51-66063-sanitized-debug.apk
          sha256sum public-downloads/aspas-beta51-66063-sanitized-debug.apk > public-downloads/aspas-beta51-66063-sanitized-debug.apk.sha256
          printf "Build sanitizada e verificada; run %s, commit %s. Fontes restaurados e APK descompactado passaram no scan. Não homologada para operação.\n" "$GITHUB_RUN_ID" "$GITHUB_SHA" > public-downloads/README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public-downloads
          git diff --cached --quiet || git commit -m "Publish verified sanitized debug APK 66063"
          git push
      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aspas-beta51-66063-sanitized-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
