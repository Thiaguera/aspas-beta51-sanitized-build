name: Build sanitized debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - .ci-diagnostics/**

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout public sanitized source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        id: java
        uses: actions/setup-java@v5
        continue-on-error: true
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        id: android_sdk
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Install Android platform 35
        id: platform
        continue-on-error: true
        run: |
          set -o pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tee /tmp/sdkmanager.log

      - name: Restore sanitized source files
        id: restore
        continue-on-error: true
        run: |
          set -o pipefail
          node tools/restore-sources.cjs 2>&1 | tee /tmp/restore.log

      - name: Install Gradle 8.9
        id: gradle_install
        continue-on-error: true
        run: |
          set -o pipefail
          curl --fail --location --retry 3 --output /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip 2>&1 | tee /tmp/gradle-download.log
          echo "d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab  /tmp/gradle.zip" | sha256sum --check --strict 2>&1 | tee -a /tmp/gradle-download.log
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Assemble unsigned debug APK
        id: assemble
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee /tmp/gradle-build.log

      - name: Prepare sanitized diagnostic
        if: always()
        run: |
          mkdir -p .ci-diagnostics
          redact() { sed -E -e "s/(token|password|secret|api[_-]?key|authorization)[=:][^[:space:]]+/\1=[REDACTED]/Ig" -e "s/gh[pousr]_[A-Za-z0-9_]+/[REDACTED_GITHUB_TOKEN]/g"; }
          {
            echo "# Diagnóstico da compilação de teste"
            echo
            echo "Este arquivo é produzido automaticamente pelo workflow público. Ele não contém fontes restaurados, variáveis de ambiente ou credenciais."
            echo
            echo "- Commit analisado: ${GITHUB_SHA}"
            echo "- Execução: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- JDK: ${{ steps.java.outcome }}"
            echo "- Android SDK: ${{ steps.android_sdk.outcome }}"
            echo "- Plataforma Android 35: ${{ steps.platform.outcome }}"
            echo "- Restauração de fontes sanitizados: ${{ steps.restore.outcome }}"
            echo "- Gradle 8.9: ${{ steps.gradle_install.outcome }}"
            echo "- assembleDebug: ${{ steps.assemble.outcome }}"
            for log in /tmp/restore.log /tmp/sdkmanager.log /tmp/gradle-download.log /tmp/gradle-build.log; do
              if [ -f "$log" ]; then
                echo
                echo "## $(basename "$log")"
                echo "\`\`\`text"
                tail -n 350 "$log" | redact
                echo "\`\`\`"
              fi
            done
          } > .ci-diagnostics/latest.md

      - name: Publish diagnostic in this public test repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-diagnostics/latest.md
          git diff --cached --quiet || git commit -m "Publish sanitized CI diagnostic"
          git push

      - name: Upload debug APK
        if: steps.assemble.outcome == "success"
        uses: actions/upload-artifact@v4
        with:
          name: aspas-beta51-66062-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Mark build as failed after publishing diagnostic
        if: always()
        run: |
          test "${{ steps.java.outcome }}" = "success"
          test "${{ steps.android_sdk.outcome }}" = "success"
          test "${{ steps.platform.outcome }}" = "success"
          test "${{ steps.restore.outcome }}" = "success"
          test "${{ steps.gradle_install.outcome }}" = "success"
          test "${{ steps.assemble.outcome }}" = "success"
