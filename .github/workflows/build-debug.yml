name: Build sanitized debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [.ci-diagnostics/**, public-downloads/**, source-parts/**]
permissions:
  contents: write
jobs:
  build-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - id: java
        continue-on-error: true
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "17"}
      - id: restore
        continue-on-error: true
        run: node tools/restore-sources.cjs
      - id: gradle_install
        continue-on-error: true
        run: |
          curl --fail --location --retry 3 --output /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          echo "d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab  /tmp/gradle.zip" | sha256sum --check --strict
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"
      - id: assemble
        continue-on-error: true
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify and scan APK
        id: apk_scan
        if: steps.assemble.outcome == 'success'
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          unzip -l "$apk" | grep -q AndroidManifest.xml
          forbidden="gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|AIza[0-9A-Za-z_-]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk_(live|test)_[A-Za-z0-9]{16,}"
          ! strings -a "$apk" | grep -E -i "$forbidden"
          sha256sum "$apk"
      - name: Publish scanned APK to public repository
        id: publication
        if: steps.apk_scan.outcome == 'success'
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          mkdir -p public-downloads
          cp "$apk" public-downloads/aspas-beta51-66062-debug.apk
          sha256sum public-downloads/aspas-beta51-66062-debug.apk > public-downloads/aspas-beta51-66062-debug.apk.sha256
          printf "Build debug sanitizada; run %s, commit %s. Publicada somente após verificação ZIP/AndroidManifest e scan de padrões de credenciais. Não homologada para operação.\n" "$GITHUB_RUN_ID" "$GITHUB_SHA" > public-downloads/README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-downloads
          git diff --cached --quiet || git commit -m "Publish scanned sanitized debug APK"
          git push
      - name: Upload scanned APK artifact
        if: steps.apk_scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: aspas-beta51-66062-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Fail if a check failed
        if: always()
        run: |
          test "${{ steps.java.outcome }}" = success
          test "${{ steps.restore.outcome }}" = success
          test "${{ steps.gradle_install.outcome }}" = success
          test "${{ steps.assemble.outcome }}" = success
          test "${{ steps.apk_scan.outcome }}" = success
          test "${{ steps.publication.outcome }}" = success
